version: "3.9"

services:
  riskyn:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: riskyn_ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
