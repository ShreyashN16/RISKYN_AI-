services:
  - type: web
    name: riskyn-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://riskyn-ai.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
    healthCheckPath: /api/health
